<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-caption">
  <div class="viewer-bar">
    <p id="viewer-caption"></p>
    <button class="vbtn" type="button" id="viewer-close">Close</button>
  </div>
  <div class="viewer-stage"><img id="viewer-img" alt=""></div>
  <div class="viewer-nav">
    <button class="vbtn" type="button" id="viewer-prev">Previous</button>
    <span class="vbtn" id="viewer-pos" aria-live="polite"></span>
    <button class="vbtn" type="button" id="viewer-next">Next</button>
  </div>
</div>
