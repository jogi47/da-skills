name: Video Context Transcriber CI

on:
  push:
    paths:
      - "skills/video-context-transcriber/**"
      - ".github/workflows/video-context-transcriber-ci.yml"
  pull_request:
    paths:
      - "skills/video-context-transcriber/**"
      - ".github/workflows/video-context-transcriber-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew list ffmpeg || brew install ffmpeg

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress --yes

      - name: Run diagnostics
        run: python skills/video-context-transcriber/scripts/transcribe_video_context.py --doctor

      - name: Compile script
        run: python -m py_compile skills/video-context-transcriber/scripts/transcribe_video_context.py

      - name: Run tests
        run: python -m unittest discover -s skills/video-context-transcriber/tests -v

      - name: Verify compatible binary wheels
        run: >-
          python -m pip install
          --dry-run
          --ignore-installed
          --only-binary=:all:
          -r skills/video-context-transcriber/scripts/requirements.txt
